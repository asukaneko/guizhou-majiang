<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2119" />
  <title>贵州麻将 · 贵阳捉鸡</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="brand">
        <div class="brand-tile"><span>贵</span></div>
        <div class="brand-text">
          <strong>贵州麻将</strong>
          <span id="brand-sub">贵州麻将 · 游戏大厅</span>
        </div>
      </div>
      <div class="tb-actions">
        <details id="tb-menu" class="tb-menu">
          <summary id="tb-menu-trigger" class="tb-menu-trigger" aria-label="打开游戏菜单"><span class="menu-glyph" aria-hidden="true">☰</span><span>菜单</span><span id="menu-unread" class="chat-unread hidden" aria-hidden="true"></span></summary>
          <div id="tb-menu-panel" class="tb-menu-panel" aria-label="游戏操作">
            <button id="btn-sound" class="tb-btn" title="开关音效">音效 开</button>
            <button id="btn-speed" class="tb-btn game-only" title="电脑出牌速度">速度 中</button>
            <button id="btn-auto" class="tb-btn game-only" title="由电脑接管出牌、碰杠胡，可随时关闭" aria-pressed="false">人机代打 关</button>
            <button id="btn-difficulty" class="tb-btn game-only" title="切换本地人机难度">难度 普通</button>
            <button id="btn-rules" class="tb-btn" title="查看规则">规则</button>
            <button id="btn-chat" class="tb-btn hidden" title="房间聊天" aria-controls="room-chat" aria-expanded="false">聊天<span id="chat-unread" class="chat-unread hidden" aria-hidden="true"></span></button>
            <button id="btn-rename" class="tb-btn game-only hidden" title="修改本房间昵称">修改昵称</button>
            <button id="btn-reset-scores" class="tb-btn game-only" title="清空当前玩法牌桌上的四家累计分数">清空分数</button>
            <button id="btn-new" class="tb-btn game-only" title="重新开一局">新的一局</button>
            <button id="btn-result" class="tb-btn game-only hidden" title="重新打开本局结算">本局结算</button>
            <button id="btn-lobby" class="tb-btn lobby-btn" title="回到游戏大厅">大厅</button>
            <button id="btn-fullscreen" class="tb-btn" title="全屏展示牌桌">全屏</button>
          </div>
        </details>
        <div class="win-btns">
          <button id="btn-min" class="win-btn" title="最小化">–</button>
          <button id="btn-max" class="win-btn" title="最大化">□</button>
          <button id="btn-close" class="win-btn close" title="关闭">✕</button>
        </div>
      </div>
    </header>
    <div id="net-status" class="hidden" role="status" aria-live="polite"></div>

    <div id="lobby" class="hidden"></div>

    <div id="online" class="hidden"></div>

    <main id="stage-wrap">
      <div id="stage">
        <div id="felt">
          <div class="seat seat-top" id="seat-top" data-seat="2"></div>
          <div class="seat seat-left" id="seat-left" data-seat="3"></div>
          <div class="seat seat-right" id="seat-right" data-seat="1"></div>
          <div class="seat seat-bottom" id="seat-bottom" data-seat="0"></div>

          <div class="river" id="river-top" data-seat="2"></div>
          <div class="river" id="river-left" data-seat="3"></div>
          <div class="river" id="river-right" data-seat="1"></div>
          <div class="river" id="river-bottom" data-seat="0"></div>

          <!-- 桌面中央：模拟牌墙 + 桌心 -->
          <div id="table-center" aria-hidden="true">
            <div class="wall-strip wall-top"></div>
            <div class="wall-strip wall-bottom"></div>
            <div class="wall-strip wall-left"></div>
            <div class="wall-strip wall-right"></div>
          </div>

          <div id="center-panel">
            <div class="cp-ring"></div>
            <div class="cp-round" id="cp-round">第 1 局</div>
            <div class="cp-wall">
              <div class="cp-stack"><i></i><i></i><i></i></div>
              <div class="cp-num" id="cp-wall">55</div>
              <div class="cp-label">牌墙剩余</div>
            </div>
            <div class="cp-turn" id="cp-turn">等待开局</div>
          </div>
        </div>

        <div id="calls"></div>
        <div id="actions"></div>
        <section id="round-review" class="hidden" aria-label="本局四家牌面"></section>
      </div>
    </main>
    <section id="room-chat" class="hidden" aria-labelledby="chat-title">
      <div class="chat-head"><div><h2 id="chat-title">房间聊天</h2><span id="chat-room"></span></div>
        <button id="chat-close" type="button" aria-label="收起聊天">收起</button></div>
      <div id="chat-messages" role="log" aria-label="房间聊天消息" aria-live="polite" aria-relevant="additions" tabindex="0"></div>
      <button id="chat-latest" class="hidden" type="button">查看新消息</button>
      <div id="chat-quick" aria-label="快捷聊天">
        <button type="button" data-chat-quick="大家好！">大家好</button><button type="button" data-chat-quick="稍等一下">稍等一下</button><button type="button" data-chat-quick="打得不错！">打得不错</button>
      </div>
      <p id="chat-status" role="status">仅同房间玩家可见 · 最近 100 条</p>
      <form id="chat-form">
        <label class="chat-input-label" for="chat-input">聊天内容</label>
        <input id="chat-input" type="text" inputmode="text" maxlength="400" autocomplete="off" enterkeyhint="send" placeholder="说点什么，最多 200 字" />
        <button id="chat-send" type="submit">发送</button>
      </form>
    </section>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="overlay" class="hidden" role="dialog" aria-label="游戏详情"></div>
    <dialog id="rename-dialog" aria-labelledby="rename-title">
      <form method="dialog" id="rename-form">
        <h2 id="rename-title">修改昵称</h2>
        <p>新昵称会同步给同桌玩家（最多 10 个字）。</p>
        <label for="rename-input">昵称</label>
        <input id="rename-input" name="name" maxlength="10" autocomplete="nickname" required />
        <div class="rename-actions"><button type="button" class="btn-ghost" id="rename-cancel">取消</button><button type="submit" class="btn-primary" value="save">保存并同步</button></div>
      </form>
    </dialog>
    <div id="tip" class="hidden"></div>
  </div>

  <svg id="svg-defs" width="0" height="0" aria-hidden="true">
    <defs>
      <linearGradient id="gzStick" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2b6f37" />
        <stop offset="0.45" stop-color="#7dba6d" />
        <stop offset="1" stop-color="#2b6f37" />
      </linearGradient>
      <radialGradient id="gzDot" cx="0.35" cy="0.3" r="0.85">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="0.75" stop-color="#f2f4f9" />
        <stop offset="1" stop-color="#dfe5ef" />
      </radialGradient>
    </defs>
  </svg>

  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/net.js"></script>
  <script src="js/remote-game.js"></script>
  <script src="js/online.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
